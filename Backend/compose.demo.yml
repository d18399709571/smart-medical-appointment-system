# Use only with a clean checkout and a NEW, unique Compose project name.
x-environment: &environment
  ENV: testing
  API_PORT: 8001
  SECRET_KEY: ${DEMO_SECRET_KEY:?Generate a disposable JWT key}
  POSTGRES_USER: demo
  POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Generate a disposable database password}
  POSTGRES_HOST: postgres
  POSTGRES_DB: medical_demo
  REDIS_HOST: redis
  REDIS_PASSWORD: ""
  AWS_ACCESS_KEY_ID: demo-disabled
  AWS_SECRET_ACCESS_KEY: demo-disabled
  AWS_EC2_METADATA_DISABLED: "true"
  DEEPSEEK_API_KEY: demo-disabled
  DASHSCOPE_API_KEY: demo-disabled
  DEMO_LOGIN_PASSWORD: ${DEMO_LOGIN_PASSWORD:?Generate a disposable login password}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Generate a disposable database password}
      POSTGRES_DB: medical_demo
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [isolated]
    mem_limit: 384m
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d medical_demo"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    volumes: ["redis-data:/data"]
    networks: [isolated]
    mem_limit: 96m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
  api:
    image: ${DEMO_IMAGE:-medical-demo:local}
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment: *environment
    working_dir: /app
    command: ["python", "-B", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    volumes: [".:/app:ro"]
    tmpfs: ["/app/logs:mode=1777", "/tmp:mode=1777"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [isolated]
    mem_limit: 768m
    cpus: 1
    pids_limit: 96
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/config/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20
  proxy:
    image: nginx:1.30.6-alpine3.24
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    volumes: ["./nginx/demo.conf:/etc/nginx/nginx.conf:ro"]
    tmpfs: ["/tmp:mode=1777"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:${DEMO_API_PORT:-18091}:8080"]
    networks: [entry, isolated]
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 32
    depends_on:
      api: {condition: service_healthy}

volumes:
  postgres-data:
  redis-data:
networks:
  entry:
  isolated:
    internal: true

services:
  # FastAPI应用
  app:
    build: .
    container_name: ${PROJECT_NAME:-demo}-app
    restart: unless-stopped
    environment:
      - ENV=production
    env_file:
      - ${RUNTIME_DIR:-/mnt/hgfs/MedicalRuntime}/.env
    volumes:
      - ${RUNTIME_DIR:-/mnt/hgfs/MedicalRuntime}/logs:/app/logs
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${API_PORT:-8001}/api/v1/config/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Celery Worker
  celery-worker:
    build: .
    container_name: ${PROJECT_NAME:-demo}-celery-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info -Q celery,scheduled_tasks
    env_file:
      - ${RUNTIME_DIR:-/mnt/hgfs/MedicalRuntime}/.env
    volumes:
      - ${RUNTIME_DIR:-/mnt/hgfs/MedicalRuntime}/logs:/app/logs
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
    # 禁用从镜像继承的健康检查（该检查针对 8001 端口的 HTTP 接口，celery 无 web 服务，不适用）
    healthcheck:
      disable: true

  # Celery Beat (调度器)
  celery-beat:
    build: .
    container_name: ${PROJECT_NAME:-demo}-celery-beat
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - ${RUNTIME_DIR:-/mnt/hgfs/MedicalRuntime}/.env
    volumes:
      - ${RUNTIME_DIR:-/mnt/hgfs/MedicalRuntime}/logs:/app/logs
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
    # 禁用从镜像继承的健康检查（该检查针对 8001 端口的 HTTP 接口，celery 无 web 服务，不适用）
    healthcheck:
      disable: true

  # Redis缓存和消息队列
  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:-demo}-redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_EXTERNAL_PORT:-6381}:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --raw ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx反向代理 (默认启用)
  nginx:
    image: nginx:alpine
    container_name: ${PROJECT_NAME:-demo}-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl  # SSL证书目录(可选)
    networks:
      - app-network
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Flower - Celery监控(可选)
  flower:
    build: .
    container_name: ${PROJECT_NAME:-demo}-flower
    restart: unless-stopped
    command: celery -A app.core.celery_app flower --port=5555
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    env_file:
      - ${RUNTIME_DIR:-/mnt/hgfs/MedicalRuntime}/.env
    networks:
      - app-network
    depends_on:
      - redis
      - celery-worker
    profiles:
      - monitoring
    # 覆盖从镜像继承的健康检查，改为检查 flower 自身的 5555 端口
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5555')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis-data:
    driver: local

networks:
  app-network:
    driver: bridge
